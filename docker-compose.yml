# รันทั้งระบบเป็นคอนเทนเนอร์ (PostgreSQL + backend API)
#
#   docker compose up -d --build     เริ่มทั้งระบบ
#   docker compose stop              หยุดชั่วคราว ข้อมูลยังอยู่
#   docker compose down              ลบคอนเทนเนอร์ แต่ข้อมูลยังอยู่ใน volume
#   docker compose down -v           ลบ volume ด้วย = ข้อมูลหายทั้งหมด (ระวัง)
#
# ต้องมีไฟล์ backend/.env ก่อน (คัดลอกจาก backend/.env.example แล้วตั้ง ENCRYPTION_KEY
# กับ ADMIN_TOKEN) เพราะ service backend อ่านค่าความลับจากไฟล์นั้น

services:
  postgres:
    image: postgres:16
    container_name: phishing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phishing_pass}
      POSTGRES_DB: ${POSTGRES_DB:-phishing_db}
    ports:
      - "5432:5432"
    volumes:
      # named volume: ข้อมูลอยู่ต่อแม้ลบคอนเทนเนอร์ หายก็ต่อเมื่อสั่ง down -v เท่านั้น
      - phishing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishing_user} -d ${POSTGRES_DB:-phishing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .                     # ต้องเป็น repo root เพื่อให้ COPY common/ เข้า image ได้ (ดู backend/Dockerfile)
      dockerfile: backend/Dockerfile
    container_name: phishing_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # ค่าความลับและค่าความเป็นส่วนตัวทั้งหมดมาจากไฟล์เดียวกับตอนรันบนเครื่อง
    # จะได้ไม่ต้องตั้งค่าซ้ำสองที่แล้วลืมอัปเดตข้างใดข้างหนึ่ง
    env_file:
      - ./backend/.env

    environment:
      # เฉพาะค่าที่ต้องต่างจากตอนรันบนเครื่อง (ทับค่าใน env_file)
      # ในเครือข่าย compose ต้องต่อ postgres ผ่านชื่อ service ไม่ใช่ localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-phishing_user}:${POSTGRES_PASSWORD:-phishing_pass}@postgres:5432/${POSTGRES_DB:-phishing_db}
      MODEL_DIR: /app/ml_model
      LOG_FILE: /app/logs/backend.log

    ports:
      - "8000:8000"
    volumes:
      # mount โมเดลจาก host ทับของที่ build ไว้ใน image เพื่อสลับโมเดลใหม่ได้โดยไม่ต้อง rebuild
      - ./backend/ml_model:/app/ml_model:ro
      - phishing_logs:/app/logs

volumes:
  phishing_pg_data:
  phishing_logs:
