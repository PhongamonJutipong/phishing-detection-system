<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตรวจสอบอีเมลฟิชชิง</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2343C6B4' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z'/></svg>" />
</head>
<body>

  <nav class="site-nav">
    <div class="container">
      <a class="wordmark" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/><path d="M9.2 12l2 2 3.6-4"/></svg>
        PhishMail
      </a>
      <div class="nav-links">
        <a href="index.html#how-it-works">วิธีทำงาน</a>
        <a href="index.html#features">ความสามารถ</a>
        <a href="index.html#criteria">การวัดผล</a>
      </div>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="dashboard.html">ภาพรวม</a>
      </div>
    </div>
  </nav>

  <main class="scan-page">
    <div class="container">

      <div class="scan-head">
        <div>
          <span class="eyebrow">ตรวจสอบอีเมล</span>
          <h1 data-i18n="appTitle"></h1>
          <p class="lead" data-i18n="lead"></p>
        </div>
        <div class="scan-head-right">
          <span id="server-status" class="status"><span class="dot"></span><span id="server-status-text"></span></span>
          <button id="lang-toggle" type="button" class="link-btn">EN</button>
        </div>
      </div>

      <form id="analyze-form" novalidate>
        <label for="email-text" class="sr-only" data-i18n="inputLabel"></label>
        <textarea id="email-text" rows="12" spellcheck="false" autofocus></textarea>

        <div class="form-row">
          <div class="form-hint">
            <span id="char-count"></span>
            <button type="button" id="sample-btn" class="link-btn" data-i18n="sample"></button>
            <button type="button" id="clear-btn" class="link-btn" data-i18n="clear"></button>
          </div>
          <button type="submit" id="analyze-btn" class="primary">
            <span id="analyze-label" data-i18n="analyze"></span>
          </button>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
      </form>

      <section id="result" class="result" hidden aria-live="polite">
        <div class="score-card">
          <div id="score-ring" class="score-ring">
            <span id="score-value"></span>
          </div>
          <div class="score-info">
            <h2 id="level-text"></h2>
            <p id="recommend-text"></p>
            <dl class="facts">
              <dt data-i18n="factClassification"></dt><dd id="fact-classification"></dd>
              <dt data-i18n="factLanguage"></dt><dd id="fact-language"></dd>
              <dt data-i18n="factTime"></dt><dd id="fact-time"></dd>
            </dl>
          </div>
        </div>

        <section class="panel">
          <h3 data-i18n="detailsTitle"></h3>
          <ul id="details-list"></ul>
        </section>

        <section class="panel" id="highlight-panel">
          <h3 data-i18n="highlightTitle"></h3>
          <div id="highlighted-text" class="email-preview"></div>
        </section>

        <p class="caution" data-i18n="caution"></p>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="copyright" data-i18n="footer"></span>
      <div class="footer-links">
        <a href="/docs" target="_blank" rel="noopener">API</a>
        <a href="dashboard.html">ภาพรวม</a>
        <a href="index.html">หน้าแรก</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
