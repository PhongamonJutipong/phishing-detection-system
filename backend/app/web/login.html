<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบ — PhishMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2343C6B4' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z'/></svg>" />
</head>
<body class="centered">

  <main class="auth">

    <a class="wordmark auth-brand" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/><path d="M9.2 12l2 2 3.6-4"/></svg>
      PhishMail
    </a>

    <div class="auth-card">
      <span class="draft-tag">แบบร่าง · ยังไม่เปิดใช้งาน</span>
      <h1>เข้าสู่ระบบ</h1>
      <p class="auth-sub">
        ส่วนนี้เป็นแบบร่างของหน้าจอเข้าสู่ระบบสำหรับผู้ดูแล ยังไม่ได้เชื่อมต่อกับระบบยืนยันตัวตนจริง
        การตรวจสอบอีเมลไม่จำเป็นต้องเข้าสู่ระบบ
      </p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">อีเมล</label>
          <input id="login-email" type="email" autocomplete="off" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="login-password">รหัสผ่าน</label>
          <input id="login-password" type="password" autocomplete="off" placeholder="••••••••" />
        </div>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" id="login-remember" />
            <span>จดจำการเข้าสู่ระบบ</span>
          </label>
          <a class="forgot" href="#">ลืมรหัสผ่าน</a>
        </div>

        <button type="submit" class="primary">เข้าสู่ระบบ</button>
        <p id="login-note" class="form-error" role="status"></p>
      </form>

      <div class="auth-divider"><span>หรือ</span></div>

      <a class="btn btn-ghost auth-skip" href="scan.html">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        ใช้งานโดยไม่เข้าสู่ระบบ
      </a>
    </div>

    <p class="auth-foot"><a href="index.html">กลับไปหน้าแรก</a></p>

  </main>

  <script>
    // แบบร่าง: ไม่ส่งข้อมูลออกไปที่ใด และไม่มีการยืนยันตัวตนจริง
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("login-note").textContent =
        "หน้านี้เป็นแบบร่าง ยังไม่ได้เชื่อมต่อระบบยืนยันตัวตน — ใช้ปุ่มด้านล่างเพื่อเข้าใช้งานได้เลย";
    });
  </script>
</body>
</html>
